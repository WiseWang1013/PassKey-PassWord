name: Build Android APK (PassKey离线版)

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 支持手动在GitHub页面点击触发打包

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # ========== 修复：更换有效的cmdline-tools下载链接 ==========
      - name: Install Android SDK Commandline Tools
        run: |
          sudo apt update && sudo apt install -y unzip
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          # 版本12.0 有效官方地址
          wget https://dl.google.com/android/repository/commandlinetools-linux-12.0_latest.zip
          unzip commandlinetools-linux-12.0_latest.zip
          # 解压出来文件夹名字是 cmdline-tools，重命名为 latest
          mv cmdline-tools latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV
          # 同意协议，安装打包必须组件
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Cordova
        run: npm install -g cordova

      - name: Prepare Cordova project
        run: |
          # 如果 passkey-app 文件夹不存在，则新建cordova项目
          if [ ! -d "passkey-app" ]; then
            cordova create passkey-app com.wisewang.passkey PassKey
          fi
          cd passkey-app
          # 清空cordova默认www目录，替换成你的V2.1.1_WEB网页源码
          rm -rf www/*
          cp -r ../V2.1.1_WEB/* www/
          # 添加安卓平台
          cordova platform add android --nosave

      - name: Build Android Debug APK（离线无INTERNET权限）
        run: |
          cd passkey-app
          cordova build android

      # 【调试】打印打包输出目录，看apk真实位置
      - name: List APK output directory
        run: |
          cd passkey-app
          ls -R platforms/android/app/build/outputs/apk

      # 上传产物：**递归搜索所有子文件夹内apk，解决路径找不到问题
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassKey-Offline-APK
          path: ./passkey-app/platforms/android/app/build/outputs/apk/**/*.apk
          retention-days: 90
