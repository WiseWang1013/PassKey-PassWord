name: Build PassKey Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 lw.Web2Android CLI
        run: |
          sudo apt update
          sudo apt install -y wget unzip
          wget https://github.com/lxw112190/lw.Web2Android/releases/latest/download/lw.Web2Android-linux-x64.zip
          unzip lw.Web2Android-linux-x64.zip

      - name: 编译APK，禁用网络权限
        run: |
          ./lw.Web2Android.CLI build \
            --source ./V2.1.1_WEB \
            --app-name "PassKey 通行密钥" \
            --package com.wisewang1013.passkey \
            --version-name 2.1.1 \
            --version-code 211 \
            --no-internet true

      - name: 上传APK成品
        uses: actions/upload-artifact@v4
        with:
          name: PassKey-APK
          path: ./output/*.apk
