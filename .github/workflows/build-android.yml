name: Build PassKey Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装Cordova
        run: npm install -g cordova

      - name: 创建Cordova项目
        run: |
          cordova create passkey-app com.wisewang1013.passkey "PassKey 通行密钥"
          cd passkey-app
          cordova platform add android

      - name: 复制网页源码到cordova www目录
        run: |
          rm -rf ./passkey-app/www/*
          cp -r ./V2.1.1_WEB/* ./passkey-app/www/

      - name: 移除Android联网权限（关键！实现no-internet）
        run: |
          sed -i '/<uses-permission android:name="android.permission.INTERNET"\/>/d' ./passkey-app/platforms/android/app/src/main/AndroidManifest.xml

      - name: 打包APK
        run: |
          cd passkey-app
          cordova build android --release

      - name: 上传APK成品
        uses: actions/upload-artifact@v4
        with:
          name: PassKey-APK
          path: ./passkey-app/platforms/android/app/build/outputs/apk/release/*.apk
